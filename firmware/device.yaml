substitutions:
  node_name: entryway-node-a
  friendly_name: Entryway Node A
esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: rest
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
api:
  encryption:
    key: !secret api_key
  on_client_disconnected:
    then:
      - script.execute: rest
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_disconnect:
    then:
      - script.execute: rest
globals:
  - id: mic_low
    type: float
    restore_value: false
    initial_value: '3.3f'
  - id: mic_high
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: mic_count
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: mic_clean
    type: bool
    restore_value: false
    initial_value: 'true'
output:
  - platform: ledc
    pin: GPIO26
    frequency: 50 Hz
    id: pointer_pwm
servo:
  - id: pointer
    output: pointer_pwm
    min_level: 5%
    idle_level: 7.5%
    max_level: 10%
switch:
  - platform: gpio
    pin: GPIO25
    id: relay
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: Indicator
    id: indicator
    lambda: return id(relay).state;
    turn_on_action:
      - if:
          condition:
            and:
              - api.connected:
              - binary_sensor.is_on: sensor_ok
          then:
            - script.execute: pulse
          else:
            - script.execute: rest
    turn_off_action:
      - script.execute: rest
script:
  - id: pulse
    mode: restart
    then:
      - switch.turn_on: relay
      - servo.write:
          id: pointer
          level: 0%
      - delay: 5s
      - switch.turn_off: relay
      - servo.write:
          id: pointer
          level: -100%
  - id: rest
    mode: restart
    then:
      - script.stop: pulse
      - switch.turn_off: relay
      - servo.write:
          id: pointer
          level: -100%
sensor:
  - platform: adc
    pin: GPIO34
    id: mic_voltage
    internal: true
    attenuation: 12db
    update_interval: 10ms
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x) || x <= 0.03f || x >= 3.25f) {
              id(mic_clean) = false;
            } else {
              id(mic_low) = std::min(id(mic_low), x);
              id(mic_high) = std::max(id(mic_high), x);
              if (id(mic_count) < 100000) ++id(mic_count);
            }
  - platform: template
    id: peak
    name: Sound Peak
    unit_of_measurement: V
    accuracy_decimals: 2
    update_interval: never
binary_sensor:
  - platform: template
    name: Sound Activity
    id: sound
  - platform: template
    name: Sensor OK
    id: sensor_ok
interval:
  - interval: 1s
    then:
      - lambda: |-
          const bool valid = id(mic_clean) && id(mic_count) >= 20;
          const float peak_value = valid ? id(mic_high) - id(mic_low) : NAN;
          id(sound).publish_state(valid && peak_value >= 0.25f);
          id(sensor_ok).publish_state(valid);
          id(peak).publish_state(peak_value);
          id(mic_low) = 3.3f;
          id(mic_high) = 0.0f;
          id(mic_count) = 0;
          id(mic_clean) = true;
      - if:
          condition:
            or:
              - binary_sensor.is_off: sensor_ok
              - not:
                  api.connected:
          then:
            - script.execute: rest
