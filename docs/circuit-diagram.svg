<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="750" viewBox="0 0 1140 750"><title>Two ESP32 nodes with microphone relay and pointer servo</title><rect width="1140" height="750" fill="#fff"/><g font-family="sans-serif" font-size="18" fill="#123"><text x="25" y="35">ID18: build this circuit twice (Node A / Node B), unique names, same pins</text><rect x="40" y="90" width="365" height="370" fill="#dfedf8" stroke="#123"/><text x="60" y="130">ESP32 DevKit USB5V power</text><text x="60" y="195">GPIO34 ADC ←microphone OUT</text><text x="60" y="255">GPIO25 →relay IN;10kΩ→GND</text><text x="60" y="315">GPIO26 PWM50Hz →servo signal</text><text x="60" y="375">3V3 →micVCC</text><text x="60" y="425">GND →common return</text><rect x="690" y="80" width="400" height="100" fill="#f0f8ee" stroke="#123"/><text x="710" y="115">Analog microphone module</text><text x="710" y="155">VCC3.3V;GND;OUT0–3.3V→34</text><rect x="690" y="210" width="400" height="135" fill="#f0f8ee" stroke="#123"/><text x="710" y="245">Active-high3.3V-compatible relay</text><text x="710" y="285">IN←25;VCC external5V;GND</text><text x="710" y="325">COM fused5V;NO→5Vlamp+;NC unused</text><rect x="690" y="365" width="400" height="95" fill="#f0f8ee" stroke="#123"/><text x="710" y="400">Micro servo with loose pointer</text><text x="710" y="440">Signal←26;V+ external5V;GND</text><text x="25" y="515">External5V≥1A →1A fuse →relayVCC + relayCOM + servoV+;lamp−→GND</text><text x="25" y="560">External−,ESP32 GND,micGND,relayGND,servoGND andlamp− share return.</text><text x="25" y="605">Only low-voltage LED lamp. Servo has no door/lock linkage; PWM1–2ms bounds.</text><rect x="35" y="650" width="290" height="60" fill="#dfedf8" stroke="#123"/><text x="50" y="687">Node A encrypted native API</text><rect x="435" y="650" width="270" height="60" fill="#edf5fb" stroke="#123"/><text x="450" y="687">Wi-Fi / Home Assistant</text><rect x="815" y="650" width="290" height="60" fill="#dfedf8" stroke="#123"/><text x="830" y="687">Node B encrypted native API</text></g><g stroke="#267" stroke-width="3" fill="none"><path d="M405 190H590V150H690"/><path d="M405 250H620V280H690"/><path d="M405 310H645V430H690"/><path d="M405 420H530V475H1090"/><path d="M325 680H435M705 680H815"/></g></svg>